# StaticSnap — run it your way.
#
# OPTION A — local (free, port 3000, no domain/TLS needed):
#   docker compose up --build
#   → dashboard at http://localhost:3000
#
# OPTION B — hosted service on staticscan.muhammadabbasi.com (Caddy terminates
# TLS with automatic Let's Encrypt certificates):
#   1. Point DNS: A/AAAA record for staticscan.muhammadabbasi.com → this host.
#   2. Open ports 80 + 443 on the host firewall.
#   3. cp .env.example .env  →  set DOMAIN + secrets, then:
#      docker compose --profile prod up -d --build
#
# All settings can also be passed as environment variables; see .env.example.

name: staticsnap

services:
  # The exporter itself — identical image for local and hosted runs. The only
  # difference is which env flags you set (.env) and whether Caddy sits in
  # front (prod profile).
  app:
    build: .
    image: staticsnap:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      # Behind Caddy the client IP arrives via X-Forwarded-For; trust it so
      # per-IP rate limiting sees real visitors instead of the proxy address.
      STATICSNAP_BEHIND_PROXY: "${STATICSNAP_BEHIND_PROXY:-0}"
      STATICSNAP_DEPLOYMENT: "${STATICSNAP_DEPLOYMENT:-selfhost}"
      STATICSNAP_PUBLIC_URL: "${STATICSNAP_PUBLIC_URL:-}"
    ports:
      # Local runs publish the dashboard directly. In prod the port still
      # publishes for debugging; restrict it with firewall rules or drop the
      # mapping and reach the app only through Caddy.
      - "${APP_PORT:-3000}:3000"
    volumes:
      # Keep job logs on the host so they survive container recreation.
      - staticsnap-logs:/tmp/staticsnap-logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # TLS + reverse proxy for the hosted service. Only starts with --profile prod
  # so plain `docker compose up` stays a single-container local run.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:-staticscan.muhammadabbasi.com}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  staticsnap-logs:
  caddy-data:
  caddy-config:
