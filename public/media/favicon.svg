<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="favOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="favBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#090d16" />

  <g transform="translate(64, 64) scale(0.25)">
    <!-- Upper Orange Shutter -->
    <polygon points="-66,-126 94,-126 4,-61 -91,-61" fill="url(#favOrange)" />
    <polygon points="94,-126 114,-126 39,-41 2,-61" fill="#38bdf8" />
    <polygon points="-91,-61 -131,-16 -61,29 -56,-31" fill="url(#favOrange)" />

    <!-- Lower Blue Shutter -->
    <polygon points="-94,126 66,126 91,61 -4,61" fill="url(#favBlue)" />
    <polygon points="-114,126 -94,126 -2,61 -39,41" fill="#ea580c" />
    <polygon points="91,61 131,16 61,-29 56,31" fill="url(#favBlue)" />

    <!-- Center Cube -->
    <!-- Top Face -->
    <polygon points="0,-48 42,-24 0,0 -42,-24" fill="#fb923c" stroke="#090d16" stroke-width="4" />
    <!-- Left Face -->
    <polygon points="-42,-24 0,0 0,52 -42,28" fill="#f59e0b" stroke="#090d16" stroke-width="4" />
    <!-- Right Face -->
    <polygon points="0,0 42,-24 42,28 0,52" fill="#0284c7" stroke="#090d16" stroke-width="4" />
  </g>
</svg>
