<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Warm Orange Shutter Gradient -->
    <linearGradient id="hOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Vibrant Electric Blue Shutter Gradient -->
    <linearGradient id="hBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Text Gradient for "Snap" -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Center Cube Facets -->
    <linearGradient id="hCubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="hCubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="hCubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.2" />
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Logo Mark Container (Scale ~0.33) -->
  <g transform="translate(40, 20) scale(0.3125)" filter="url(#hGlow)">
    <polygon points="190,130 350,130 260,195 165,195" fill="url(#hOrangeGrad)" />
    <polygon points="350,130 370,130 295,215 258,195" fill="#38bdf8" />
    <polygon points="165,195 125,240 195,285 200,225" fill="url(#hOrangeGrad)" />
    <polygon points="190,130 248,130 256,192 195,192" fill="#f59e0b" />

    <polygon points="162,382 322,382 347,317 252,317" fill="url(#hBlueGrad)" />
    <polygon points="142,382 162,382 254,317 217,297" fill="#fb923c" />
    <polygon points="347,317 387,272 317,227 312,287" fill="url(#hBlueGrad)" />
    <polygon points="322,382 264,382 256,320 317,320" fill="#0369a1" />

    <!-- Isometric Central Static Cube -->
    <g transform="translate(256, 256)">
      <polygon points="0,-48 42,-24 0,0 -42,-24" fill="url(#hCubeTop)" stroke="#0b1120" stroke-width="4" stroke-linejoin="round" />
      <polygon points="-42,-24 0,0 0,52 -42,28" fill="url(#hCubeLeft)" stroke="#0b1120" stroke-width="4" stroke-linejoin="round" />
      <polygon points="0,0 42,-24 42,28 0,52" fill="url(#hCubeRight)" stroke="#0b1120" stroke-width="4" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Typography: StaticSnap -->
  <text x="230" y="118" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-0.03em">
    Static<tspan fill="url(#textGrad)">Snap</tspan>
  </text>
  
  <!-- Subtitle: Web-to-Static Replatformer -->
  <text x="234" y="152" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="0.18em">
    WEB-TO-STATIC REPLATFORMER
  </text>
</svg>
