<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background subtle deep gradient -->
    <radialGradient id="bgObsidian" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Warm Orange Shutter Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Vibrant Electric Blue Shutter Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Orange-to-Blue Transition Gradient for Connecting Blades -->
    <linearGradient id="transitionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Center Cube Highlight Facet (Top) -->
    <linearGradient id="cubeTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Center Cube Left Facet (Orange) -->
    <linearGradient id="cubeLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Center Cube Right Facet (Blue) -->
    <linearGradient id="cubeRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Ambient Shadow & Glow -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#ea580c" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Canvas Container -->
  <rect width="512" height="512" rx="96" fill="url(#bgObsidian)" />
  <rect width="510" height="510" x="1" y="1" rx="95" stroke="#1e293b" stroke-width="2" opacity="0.6" />

  <!-- Logo Mark Group -->
  <g filter="url(#logoGlow)">
    <!-- UPPER HALF OF 'S' (Warm Orange / Amber Shutter Blades) -->
    <!-- Top Horizontal Blade -->
    <polygon points="190,130 350,130 260,195 165,195" fill="url(#orangeGrad)" />
    <!-- Top-Right Dynamic Blade -->
    <polygon points="350,130 370,130 295,215 258,195" fill="#38bdf8" />
    <!-- Upper-Left Spine Blade -->
    <polygon points="165,195 125,240 195,285 200,225" fill="url(#orangeGrad)" />
    <!-- Upper Central Shutter Inward Blade -->
    <polygon points="190,130 248,130 256,192 195,192" fill="#f59e0b" />

    <!-- LOWER HALF OF 'S' (Electric Blue / Cyan Shutter Blades) -->
    <!-- Bottom Horizontal Blade -->
    <polygon points="162,382 322,382 347,317 252,317" fill="url(#blueGrad)" />
    <!-- Lower-Left Angle Blade -->
    <polygon points="142,382 162,382 254,317 217,297" fill="#fb923c" />
    <!-- Lower-Right Spine Blade -->
    <polygon points="347,317 387,272 317,227 312,287" fill="url(#blueGrad)" />
    <!-- Lower Central Shutter Inward Blade -->
    <polygon points="322,382 264,382 256,320 317,320" fill="#0369a1" />

    <!-- Isometric Central Static Cube (The Frozen Core) -->
    <g transform="translate(256, 256)">
      <!-- Top Face: Fiery Orange -->
      <polygon points="0,-48 42,-24 0,0 -42,-24" fill="url(#cubeTopGrad)" stroke="#0b1120" stroke-width="4" stroke-linejoin="round" />
      <!-- Left Face: Warm Amber -->
      <polygon points="-42,-24 0,0 0,52 -42,28" fill="url(#cubeLeftGrad)" stroke="#0b1120" stroke-width="4" stroke-linejoin="round" />
      <!-- Right Face: Deep Electric Royal Blue -->
      <polygon points="0,0 42,-24 42,28 0,52" fill="url(#cubeRightGrad)" stroke="#0b1120" stroke-width="4" stroke-linejoin="round" />
    </g>
  </g>
</svg>
